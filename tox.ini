[tox]
minversion = 3.18.0
envlist = pep8,py3

[testenv]
usedevelop = True
install_command = pip install {opts} {packages}
deps = -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
       -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt
allowlist_externals = bash
commands =
  python manage.py test {posargs:trove_dashboard.test} --settings=trove_dashboard.test.settings --exclude-tag integration

[testenv:pep8]
commands = flake8

[testenv:venv]
commands = {posargs}

[testenv:integration]
setenv =
  PYTHONHASHSEED=0
  INTEGRATION_TESTS=1
  SELENIUM_HEADLESS=1
  HORIZON_INTEGRATION_TESTS_CONFIG_FILE=trove_dashboard/test/integration/horizon.conf
commands =
  python manage.py test {posargs:trove_dashboard.test.integration} --settings=trove_dashboard.test.settings --tag integration

[testenv:cover]
commands =
  coverage erase
  coverage run --source=trove_dashboard {toxinidir}/manage.py test {posargs:trove_dashboard.test.tests} --settings=trove_dashboard.test.settings
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report

[testenv:docs]
deps = -c{env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
       -r{toxinidir}/doc/requirements.txt
commands =
  sphinx-build -a -E -W -b html doc/source doc/build/html

[testenv:debug]
commands = oslo_debug_helper {posargs}

[testenv:releasenotes]
deps = {[testenv:docs]deps}
commands = sphinx-build -a -E -W -d releasenotes/build/doctrees -b html releasenotes/source releasenotes/build/html

[flake8]
show-source = True
# F405 TEMPLATES may be undefined, or defined from star imports
# (because it is not easy to avoid this in openstack_dashboard.test.settings)
# H405 multi line docstring summary not separated with an empty line
ignore = F405,H405,W504
builtins = _
exclude=.venv,.git,.tox,dist,doc,*lib/python*,*egg,build,.ropeproject,releasenotes,.tmp
